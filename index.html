<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="euoom의 블로그. 특별했던 순간은 오래 간직하고, 평범했던 날에서는 미처 발견하지 못한 의미를 찾아봅니다." />
    <meta name="author" content="euoom" />
    <meta name="theme-color" content="#0b0d10" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="euoom — Blog" />
    <meta property="og:description" content="특별했던 순간은 오래 간직하고, 평범했던 날에서는 미처 발견하지 못한 의미를 찾아봅니다. 개발과 일상 속에서 지나온 시간을 돌아보며 남기는 이야기입니다." />
    <meta property="og:url" content="https://euoom.github.io/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://euoom.github.io/" />
    <link rel="alternate" type="application/rss+xml" title="euoom — Blog" href="./feed.xml" />
    <title>euoom — Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
    <link rel="stylesheet" href="./styles.css" />

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3049332347805104" crossorigin="anonymous"></script>
    <script defer src="./app.js?v=20261019-1"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="./" aria-label="euoom 홈">
          <span class="brand-mark" aria-hidden="true">e.</span>
          <span>euoom</span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="./" class="nav-link active">Blog</a>
          <a href="https://github.com/euoom" class="nav-link" target="_blank" rel="noopener noreferrer">GitHub</a>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 변경" title="테마 변경">☀</button>
        </nav>
      </div>
    </header>

    <main id="main" class="shell">
      <section id="post-list-view">
        <div class="hero">
          <p class="eyebrow">EUOOM'S BLOG</p>
          <h1>지나간 시간을<br />다시 바라봅니다.</h1>
          <p class="hero-copy">특별했던 순간은 오래 간직하고, 평범했던 날에서는 미처 발견하지 못한 의미를 찾아봅니다. 개발과 일상 속에서 지나온 시간을 돌아보며 남기는 이야기입니다.</p>
          <div class="hero-links">
            <a href="https://github.com/euoom" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
            <a href="https://euoom.github.io/etf-portfolio-profiler/" target="_blank" rel="noopener noreferrer">ETF Portfolio Profiler ↗</a>
          </div>
        </div>

        <section class="archive" aria-label="글 목록">
          <div class="section-heading archive-heading">
            <div>
              <p class="eyebrow">ARCHIVE</p>
              <h2>Notes & Projects</h2>
            </div>
            <p id="post-count" class="post-count" aria-live="polite"></p>
          </div>
          <div class="controls archive-controls">
            <label class="search-wrap">
              <span class="sr-only">글 검색</span>
              <span aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="Search notes..." autocomplete="off" />
            </label>
          </div>
          <section class="archive-group" aria-labelledby="projects-title">
            <div class="section-heading group-heading">
              <div><p class="eyebrow">PROJECTS</p><h3 id="projects-title">진행 중인 프로젝트</h3></div>
              <span id="projects-count" class="post-count"></span>
            </div>
            <div id="projects-grid" class="posts-list"></div>
          </section>
          <section class="archive-group" aria-labelledby="weekly-title">
            <div class="section-heading group-heading">
              <div><p class="eyebrow">WEEKLY NOTES</p><h3 id="weekly-title">주간 회고</h3></div>
              <span id="weekly-count" class="post-count"></span>
            </div>
            <div id="weekly-grid" class="posts-list"></div>
          </section>
          <section class="archive-group" aria-labelledby="notes-title">
            <div class="section-heading group-heading">
              <div><p class="eyebrow">TECH NOTES</p><h3 id="notes-title">기술 노트</h3></div>
              <span id="notes-count" class="post-count"></span>
            </div>
            <div id="notes-grid" class="posts-list"></div>
          </section>
        </section>
      </section>

    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© <span id="current-year">2026</span> euoom</p>
      </div>
    </footer>
  </body>
</html>
